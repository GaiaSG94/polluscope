name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Validate station data
        run: python3 -c "import json; d=json.load(open('data/stations.json')); assert d['stations']; print(len(d['stations']), 'stations OK')"
